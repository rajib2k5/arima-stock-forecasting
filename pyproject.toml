[project]
name = "arima-stock-forecasting"
version = "0.1.0"
description = "ARIMA stock forecasting, done carefully: a learning repo with notebooks, tests and a JSON contract for a small web app."
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "statsmodels==0.15.0",
  "pmdarima==2.1.1",
  "scikit-learn==1.9.1",
  "pandas==3.1.0",
  "yfinance==1.7.0",
  "matplotlib==3.11.2",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "arima_forecasting"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "nbformat==5.11.1",
  "nbclient==0.11.0",
  "ipykernel==7.4.0",
]
